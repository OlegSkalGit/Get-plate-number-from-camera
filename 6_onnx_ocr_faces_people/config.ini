; ANPR, Face & People Video Monitor Configuration
; -------------------------------------------------------------
; ЗАГАЛЬНІ НАЛАШТУВАННЯ:
; source: 0, rtsp://... або d:\video.mp4 (джерело відеопотоку)
; autostart_os_and_play: true / false (автозапуск трансляції)
; delete_older_days: видаляти файли старше зазначених днів (таймер раз на добу)
;
; МОДУЛЬ НОМЕРІВ (plates_):
; plates_on: true / false (фіксація номерних знаків)
; plates_debug: true / false (збереження текстових дебаг-логів)
; plates_min_percent_to_save: мінімальна точність розпізнавання для збереження (%)
; plates_sleep_time_after_save: таймаут ігнорування дублікатів того самого номера (с)
; plates_view_time: час збереження номера на екрані (с)
; plates_rect_scale: масштаб номера у правому верхньому кутку (базове 5.0)
; plates_rect_user_top, left, width, height: геометрія вікна виділення ROI
;
; МОДУЛЬ ОБЛИЧ (faces_):
; faces_on: true / false (фіксація облич)
; faces_min_similarity: поріг схожості векторів облич (0.7 = 70%)
; faces_det_thresh: поріг детекції облич
; faces_min_size: мінімальний розмір обличчя в пікселях (20 для віддалених камер, 45 стандарт)
;
; МОДУЛЬ ЛЮДЕЙ (people_):
; people_on: true / false (фіксація людей та скріншоти)
; people_det_thresh: поріг детекції людей (0.45)
; people_timer_ms: інтервал створення скріншотів людей (мс, за замовчуванням 1000)
; -------------------------------------------------------------

